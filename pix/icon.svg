<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMid meet">
  <defs>
    <!-- Steel Blade Gradients -->
    <linearGradient id="bladeLeft" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bladeRight" x1="58" y1="6" x2="38" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Gold Hilt Gradients -->
    <linearGradient id="goldHilt" x1="10" y1="45" x2="25" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldHiltR" x1="54" y1="45" x2="39" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Book Cover Gradient (Royal Deep Indigo / Sapphire) -->
    <linearGradient id="bookCover" x1="12" y1="20" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Book Page Gradients (Left and Right curvature) -->
    <linearGradient id="pageLeft" x1="31" y1="30" x2="14" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="20%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="33" y1="30" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="20%" stop-color="#F1F5F9"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="32" y1="40" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="swordShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <filter id="bookShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#FDE047" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- ==================== LAYER 1: CROSSED SWORDS ==================== -->
  <g filter="url(#swordShadow)">
    <!-- SWORD 1: Top-Left to Bottom-Right -->
    <!-- Blade Top-Left -->
    <path d="M6 6 L20 20 L16.5 23.5 L2.5 9.5 L2 5.5 L6 6 Z" fill="url(#bladeLeft)"/>
    <path d="M2 5.5 L20 20 L18.5 21.5 L2 5.5 Z" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Crossguard Bottom-Right -->
    <rect x="44" y="47" width="13" height="3.4" rx="1.7" transform="rotate(-45 44 47)" fill="url(#goldHiltR)"/>
    <!-- Center Jewel on Crossguard -->
    <circle cx="48.5" cy="48.5" r="1.5" fill="#DC2626"/>
    <circle cx="48" cy="48" r="0.5" fill="#FFFFFF"/>
    <!-- Grip -->
    <path d="M48 50 L53.5 55.5" stroke="#991B1B" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M48 50 L53.5 55.5" stroke="#FEF08A" stroke-width="0.8" stroke-dasharray="1.2 2"/>
    <!-- Pommel -->
    <circle cx="56" cy="58" r="2.8" fill="url(#goldHiltR)"/>
    <circle cx="55.2" cy="57.2" r="0.9" fill="#FFFBEB"/>

    <!-- SWORD 2: Top-Right to Bottom-Left -->
    <!-- Blade Top-Right -->
    <path d="M58 6 L44 20 L47.5 23.5 L61.5 9.5 L62 5.5 L58 6 Z" fill="url(#bladeRight)"/>
    <path d="M62 5.5 L44 20 L45.5 21.5 L62 5.5 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Crossguard Bottom-Left -->
    <rect x="17.5" y="49.5" width="13" height="3.4" rx="1.7" transform="rotate(45 17.5 49.5)" fill="url(#goldHilt)"/>
    <!-- Center Jewel on Crossguard -->
    <circle cx="15.5" cy="48.5" r="1.5" fill="#DC2626"/>
    <circle cx="15" cy="48" r="0.5" fill="#FFFFFF"/>
    <!-- Grip -->
    <path d="M16 50 L10.5 55.5" stroke="#991B1B" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M16 50 L10.5 55.5" stroke="#FEF08A" stroke-width="0.8" stroke-dasharray="1.2 2"/>
    <!-- Pommel -->
    <circle cx="8" cy="58" r="2.8" fill="url(#goldHilt)"/>
    <circle cx="7.2" cy="57.2" r="0.9" fill="#FFFBEB"/>
  </g>

  <!-- ==================== LAYER 2: OPEN BOOK (CENTER) ==================== -->
  <g filter="url(#bookShadow)">
    <!-- Book Hardcover (Dark Base beneath pages) -->
    <path d="M32 20.5 C25 17.5 17 18 10 20 C9 20.3 8 21.2 8 22.3 L8 44 C8 45.2 9 46.2 10.2 45.8 C17 43.8 25 43.5 32 46.5 C39 43.5 47 43.8 53.8 45.8 C55 46.2 56 45.2 56 44 L56 22.3 C56 21.2 55 20.3 54 20 C47 18 39 17.5 32 20.5 Z" fill="url(#bookCover)"/>
    <!-- Gold Trim on Book Cover Rim -->
    <path d="M8 43.5 L8 44.5 C8 45.6 9 46.5 10.2 46.2 C17 44.2 25 44 32 47 C39 44 47 44.2 53.8 46.2 C55 46.5 56 45.6 56 44.5 L56 43.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Left Open Page -->
    <path d="M31 22 C24.5 19 17 19.5 11 21.5 C10.4 21.7 10 22.2 10 22.8 L10 43.5 C10 44.1 10.5 44.6 11.2 44.4 C17 42.5 24.5 42.2 31 44.8 L31 22 Z" fill="url(#pageLeft)"/>
    <!-- Left Page Subtle Spine Shadow -->
    <path d="M31 22 L31 44.8 C28.5 43.8 26 43.2 23.5 43 L23.5 20.5 C26 20.8 28.5 21.2 31 22 Z" fill="#94A3B8" opacity="0.25"/>

    <!-- Right Open Page -->
    <path d="M33 22 C39.5 19 47 19.5 53 21.5 C53.6 21.7 54 22.2 54 22.8 L54 43.5 C54 44.1 53.5 44.6 52.8 44.4 C47 42.5 39.5 42.2 33 44.8 L33 22 Z" fill="url(#pageRight)"/>
    <!-- Right Page Subtle Spine Shadow -->
    <path d="M33 22 L33 44.8 C35.5 43.8 38 43.2 40.5 43 L40.5 20.5 C38 20.8 35.5 21.2 33 22 Z" fill="#64748B" opacity="0.25"/>

    <!-- Left Page Content: Question / Knowledge Lines (Gold / Slate) -->
    <g opacity="0.75">
      <rect x="14" y="25" width="13" height="2" rx="1" fill="#6366F1"/>
      <rect x="14" y="29.5" width="13" height="1.8" rx="0.9" fill="#94A3B8"/>
      <rect x="14" y="33.5" width="11" height="1.8" rx="0.9" fill="#94A3B8"/>
      <rect x="14" y="37.5" width="8" height="1.8" rx="0.9" fill="#F59E0B"/>
    </g>

    <!-- Right Page Content: Duel / Quiz Lines + Spark -->
    <g opacity="0.75">
      <rect x="37" y="25" width="13" height="2" rx="1" fill="#6366F1"/>
      <rect x="37" y="29.5" width="13" height="1.8" rx="0.9" fill="#94A3B8"/>
      <rect x="37" y="33.5" width="10" height="1.8" rx="0.9" fill="#94A3B8"/>
      <rect x="40" y="37.5" width="10" height="1.8" rx="0.9" fill="#F59E0B"/>
    </g>

    <!-- Center Spine Line -->
    <line x1="32" y1="21" x2="32" y2="45.5" stroke="#475569" stroke-width="1.2"/>

    <!-- Golden Ribbon Bookmark hanging from center spine -->
    <path d="M30.5 43 L33.5 43 L33.5 53.5 L32 51.5 L30.5 53.5 Z" fill="url(#ribbonGrad)"/>
    <path d="M30.5 43 L32 43 L32 51.5 L30.5 53.5 Z" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- ==================== LAYER 3: KNOWLEDGE & BATTLE SPARKLES ==================== -->
  <g filter="url(#goldGlow)">
    <!-- Central Knowledge Spark above Book -->
    <path d="M32 11 Q32 15 34 15 Q32 15 32 19 Q32 15 30 15 Q32 15 32 11 Z" fill="#FEF08A"/>
    <!-- Top-Left Sparkle -->
    <circle cx="16" cy="14" r="1.2" fill="#FEF08A"/>
    <!-- Top-Right Sparkle -->
    <circle cx="48" cy="14" r="1.2" fill="#FEF08A"/>
    <!-- Center Spark Core -->
    <circle cx="32" cy="15" r="1" fill="#FFFFFF"/>
  </g>
</svg>
